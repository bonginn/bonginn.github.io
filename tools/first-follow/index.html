<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIRST / FOLLOW Calculator · bonginn</title>
<script>
(function() {
  const stored = localStorage.getItem('tools-theme');
  const theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e5e5e5;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --success: #16a34a;
    --error: #dc2626;
    --code-bg: #f3f4f6;
  }
  [data-theme="dark"] {
    --bg: #0f0f0f;
    --card: #1a1a1a;
    --text: #e5e5e5;
    --muted: #999;
    --border: #2a2a2a;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --success: #4ade80;
    --error: #f87171;
    --code-bg: #222;
  }
  .theme-toggle {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: border-color 0.2s, color 0.2s, transform 0.2s;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); transform: rotate(15deg); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
  }
  .back {
    display: inline-block;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
  }
  .back:hover { color: var(--accent); }
  h1 {
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 2.6rem;
    font-weight: 500;
    margin: 0 0 0.5rem;
    letter-spacing: -0.01em;
  }
  .subtitle { color: var(--muted); margin: 0 0 2rem; }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  .panel h2 {
    margin: 0 0 0.75rem;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  textarea {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.85rem;
    font-size: 0.92rem;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    resize: vertical;
    min-height: 180px;
    line-height: 1.6;
    transition: border-color 0.15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .syntax-hint {
    color: var(--muted);
    font-size: 0.82rem;
    margin-top: 0.6rem;
    line-height: 1.5;
  }
  .syntax-hint code {
    background: var(--code-bg);
    padding: 0.1rem 0.35rem;
    border-radius: 4px;
    font-size: 0.85rem;
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.85rem;
    flex-wrap: wrap;
  }
  .control-row label {
    font-size: 0.88rem;
    color: var(--muted);
  }
  select, input[type="text"] {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-size: 0.88rem;
    font-family: inherit;
  }
  input[type="text"] { font-family: 'SF Mono', Menlo, Consolas, monospace; min-width: 100px; }

  .btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.5rem 0.9rem;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 500;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn.secondary:hover { border-color: var(--accent); color: var(--accent); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    font-size: 0.92rem;
  }
  th, td {
    text-align: left;
    padding: 0.6rem 0.85rem;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--muted);
    font-weight: 600;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  tr:last-child td { border-bottom: none; }
  td.nt {
    font-weight: 600;
    color: var(--accent);
    width: 80px;
  }
  td.set {
    color: var(--text);
  }
  .epsilon { color: var(--muted); font-style: italic; }
  .end-marker { color: var(--success); font-weight: 600; }

  .error {
    color: var(--error);
    background: rgba(220, 38, 38, 0.08);
    border: 1px solid rgba(220, 38, 38, 0.2);
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.88rem;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
  }

  .empty-state {
    color: var(--muted);
    text-align: center;
    padding: 2rem 1rem;
    font-size: 0.9rem;
  }

  .examples {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.6rem;
  }
  .example-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 0.3rem 0.7rem;
    border-radius: 999px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .example-btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<button id="themeToggle" class="theme-toggle" aria-label="Toggle theme"></button>
<div class="container">
  <a href="/tools/" class="back">← tools</a>
  <h1>FIRST / FOLLOW Calculator</h1>
  <p class="subtitle">Compute FIRST and FOLLOW sets for a context-free grammar.</p>

  <div class="panel">
    <h2>Grammar</h2>
    <textarea id="input" spellcheck="false" autocomplete="off">E -> T E'
E' -> + T E' | ε
T -> F T'
T' -> * F T' | ε
F -> ( E ) | id</textarea>
    <p class="syntax-hint">
      Format: <code>LHS -> RHS1 | RHS2 | ...</code>. Tokens are space-separated. Use <code>ε</code> or leave RHS empty for epsilon. Uppercase-leading tokens are non-terminals.
    </p>
    <div class="examples">
      <button class="example-btn" data-ex="arith">Arithmetic</button>
      <button class="example-btn" data-ex="ifelse">If-else</button>
      <button class="example-btn" data-ex="list">List</button>
    </div>
    <div class="control-row">
      <label for="startSymbol">Start symbol:</label>
      <input type="text" id="startSymbol" placeholder="auto (first LHS)">
    </div>
  </div>

  <div class="panel">
    <h2>Results</h2>
    <div id="results"><div class="empty-state">Enter a grammar above to compute sets</div></div>
  </div>
</div>

<script>
const inputEl = document.getElementById('input');
const startEl = document.getElementById('startSymbol');
const resultsEl = document.getElementById('results');

const EPS = 'ε';
const END = '$';

const EXAMPLES = {
  arith: `E -> T E'
E' -> + T E' | ε
T -> F T'
T' -> * F T' | ε
F -> ( E ) | id`,
  ifelse: `S -> i E t S S' | a
S' -> e S | ε
E -> b`,
  list: `L -> E L'
L' -> , E L' | ε
E -> id`
};

document.querySelectorAll('.example-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    inputEl.value = EXAMPLES[btn.dataset.ex];
    startEl.value = '';
    compute();
  });
});

let debounceTimer;
function scheduleCompute() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(compute, 200);
}
inputEl.addEventListener('input', scheduleCompute);
startEl.addEventListener('input', scheduleCompute);

function parseGrammar(text) {
  const productions = [];
  const order = [];
  const lhsSet = new Set();
  const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
  if (lines.length === 0) throw new Error('Empty grammar');

  for (const line of lines) {
    const arrowMatch = line.match(/^(.+?)\s*(?:->|→|::=)\s*(.*)$/);
    if (!arrowMatch) throw new Error(`Missing "->" in line: ${line}`);
    const lhs = arrowMatch[1].trim();
    if (!lhs) throw new Error(`Empty LHS in line: ${line}`);
    if (lhs.includes(' ')) throw new Error(`LHS must be a single symbol: ${lhs}`);
    const rhsRaw = arrowMatch[2];
    const alts = rhsRaw.split('|').map(a => a.trim());
    if (!lhsSet.has(lhs)) { lhsSet.add(lhs); order.push(lhs); }
    for (const alt of alts) {
      const tokens = alt.split(/\s+/).filter(t => t.length > 0);
      const symbols = tokens.length === 0 || tokens.every(t => t === EPS || t === 'epsilon' || t === 'eps')
        ? []
        : tokens.filter(t => t !== EPS && t !== 'epsilon' && t !== 'eps');
      productions.push({ lhs, rhs: symbols });
    }
  }

  const nonTerminals = new Set(order);
  const terminals = new Set();
  for (const p of productions) {
    for (const sym of p.rhs) {
      if (!nonTerminals.has(sym)) terminals.add(sym);
    }
  }

  return { productions, order, nonTerminals, terminals };
}

function isNonTerminal(sym, nonTerminals) {
  return nonTerminals.has(sym);
}

function firstOfSequence(seq, first, nonTerminals) {
  const result = new Set();
  if (seq.length === 0) { result.add(EPS); return result; }
  let allEps = true;
  for (const sym of seq) {
    if (!isNonTerminal(sym, nonTerminals)) {
      result.add(sym);
      allEps = false;
      break;
    }
    const symFirst = first[sym] || new Set();
    for (const s of symFirst) if (s !== EPS) result.add(s);
    if (!symFirst.has(EPS)) { allEps = false; break; }
  }
  if (allEps) result.add(EPS);
  return result;
}

function computeFirst(productions, nonTerminals, order) {
  const first = {};
  for (const nt of order) first[nt] = new Set();

  let changed = true;
  while (changed) {
    changed = false;
    for (const { lhs, rhs } of productions) {
      const seqFirst = firstOfSequence(rhs, first, nonTerminals);
      for (const s of seqFirst) {
        if (!first[lhs].has(s)) { first[lhs].add(s); changed = true; }
      }
    }
  }
  return first;
}

function computeFollow(productions, first, nonTerminals, order, start) {
  const follow = {};
  for (const nt of order) follow[nt] = new Set();
  follow[start].add(END);

  let changed = true;
  while (changed) {
    changed = false;
    for (const { lhs, rhs } of productions) {
      for (let i = 0; i < rhs.length; i++) {
        const B = rhs[i];
        if (!isNonTerminal(B, nonTerminals)) continue;
        const beta = rhs.slice(i + 1);
        const firstBeta = firstOfSequence(beta, first, nonTerminals);
        for (const s of firstBeta) {
          if (s !== EPS && !follow[B].has(s)) { follow[B].add(s); changed = true; }
        }
        if (firstBeta.has(EPS)) {
          for (const s of follow[lhs]) {
            if (!follow[B].has(s)) { follow[B].add(s); changed = true; }
          }
        }
      }
    }
  }
  return follow;
}

function renderSet(set) {
  if (set.size === 0) return '<span class="epsilon">∅</span>';
  const sorted = [...set].sort((a, b) => {
    if (a === EPS) return 1;
    if (b === EPS) return -1;
    if (a === END) return 1;
    if (b === END) return -1;
    return a.localeCompare(b);
  });
  return sorted.map(s => {
    if (s === EPS) return '<span class="epsilon">ε</span>';
    if (s === END) return '<span class="end-marker">$</span>';
    return escapeHtml(s);
  }).join(', ');
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function compute() {
  const text = inputEl.value;
  if (!text.trim()) {
    resultsEl.innerHTML = '<div class="empty-state">Enter a grammar above to compute sets</div>';
    return;
  }
  try {
    const { productions, order, nonTerminals } = parseGrammar(text);
    const startInput = startEl.value.trim();
    const start = startInput || order[0];
    if (!nonTerminals.has(start)) {
      throw new Error(`Start symbol "${start}" is not a non-terminal`);
    }
    const first = computeFirst(productions, nonTerminals, order);
    const follow = computeFollow(productions, first, nonTerminals, order, start);

    let html = '<table><thead><tr><th>Non-terminal</th><th>FIRST</th><th>FOLLOW</th></tr></thead><tbody>';
    for (const nt of order) {
      html += `<tr><td class="nt">${escapeHtml(nt)}${nt === start ? ' <span style="color:var(--muted);font-weight:400;font-size:0.75rem;">(start)</span>' : ''}</td><td class="set">${renderSet(first[nt])}</td><td class="set">${renderSet(follow[nt])}</td></tr>`;
    }
    html += '</tbody></table>';
    resultsEl.innerHTML = html;
  } catch (e) {
    resultsEl.innerHTML = `<div class="error">${escapeHtml(e.message)}</div>`;
  }
}

compute();

const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
const themeToggle = document.getElementById('themeToggle');
function syncIcon() {
  themeToggle.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? SUN : MOON;
}
syncIcon();
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('tools-theme', next);
  syncIcon();
});
</script>
</body>
</html>
